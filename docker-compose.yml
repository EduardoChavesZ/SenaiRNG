services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rng
      POSTGRES_USER: rng
      POSTGRES_PASSWORD: rng
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rng -d rng"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
